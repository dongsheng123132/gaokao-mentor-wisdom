<!-- og.png 的源文件。重新生成：Chrome headless --window-size=1200,630 --screenshot=site/og.png site/og-card.html -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #16395f; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { padding: 64px 72px 0; border-bottom: none; }
  .kicker { font-size: 22px; color: #9fc0e6; letter-spacing: 2px; }
  h1 { font-size: 88px; letter-spacing: 4px; margin: 18px 0 14px; font-weight: 700; }
  .sub { font-size: 30px; color: #d6e2f2; }
  .rule { height: 6px; background: #c62828; width: 100%; }
  .mid { padding: 40px 72px 0; display: flex; gap: 32px; align-items: flex-start; }
  .quote { flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 30px 34px; }
  .quote p { font-size: 30px; line-height: 1.55; }
  .quote .src { margin-top: 16px; font-size: 20px; color: #9fc0e6; }
  .stats { width: 300px; display: flex; flex-direction: column; gap: 14px; }
  .stat { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 16px 20px; }
  .stat b { font-size: 36px; color: #ffd479; }
  .stat span { font-size: 19px; color: #d6e2f2; margin-left: 10px; }
  .bottom { padding: 0 72px 44px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: #9fc0e6; }
  .bottom code { font-family: ui-monospace, Menlo, monospace; font-size: 19px; color: #d6e2f2; }
</style></head>
<body>
  <div>
    <div class="top">
      <div class="kicker">GAOKAO MENTOR WISDOM · MIT</div>
      <h1>张雪峰语录大全</h1>
      <div class="sub">高考志愿填报 · 专业选择 · 就业现实</div>
    </div>
    <div class="rule"></div>
    <div class="mid">
      <div class="quote">
        <p>「如果你家境一般，没有任何社会资源，不要学金融。」</p>
        <div class="src">zxf-zhuanye-001 · 广泛归于他 · 抖音直播</div>
      </div>
      <div class="stats">
        <div class="stat"><b>105</b><span>条结构化语料</span></div>
        <div class="stat"><b>6</b><span>大分类</span></div>
        <div class="stat"><b>0/34/71</b><span>可信度分档</span></div>
      </div>
    </div>
  </div>
  <div class="bottom">
    <span>每条带出处与可信度标注 · 可直接用于 AI 问答</span>
    <code>github.com/dongsheng123132/gaokao-mentor-wisdom</code>
  </div>
</body></html>
